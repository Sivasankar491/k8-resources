apiVersion: v1
kind: PersistentVolume
metadata: 
  name: ebs-static-pv
spec:
  accessModes: 
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  csi: 
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-07bf667c17c8318a2

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-pvc
spec:
  storageClassName: ""
  volumeName: ebs-static-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
  lables:
    purpose: ebs-static
spec:
  volumes:
  - name: ebs-static-volume
    persistentVolumeClaim:
      claimName: ebs-static-pvc
  containers:
  - name: ebs-static-nginx
    iamge: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: ebs-static-mount
      mountPath: /usr/share/nginx/html

---
apiVersion: v1
kind: Service
metadata:
  name: ebs-static-svc
  lables:
    purpose: ebs-static
spec:
  type: LoadBalancer
  selectors:
    purpose: ebs-storage
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30072
    

  
    




