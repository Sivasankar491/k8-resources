apiVersion: v1
kind: PersistentVolume
metadata: 
  name: ebs-static-pv
spec:
  accessModes: 
  - ReadWriteOnce
  capacity:
    storage: 10Gi
  csi: 
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-02f63f9de343861e1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-pvc
spec:
  storageClassName: ""
  volumeName: ebs-static-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
  labels:
    purpose: ebs-static
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1d
spec:
  volumes:
  - name: ebs-static-volume
    persistentVolumeClaim:
      claimName: ebs-static-pvc
  containers:
  - name: ebs-static-nginx
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: ebs-static-volume
      mountPath: /usr/share/nginx/html

---
apiVersion: v1
kind: Service
metadata:
  name: ebs-static-svc
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-storage
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30072
    

  
    




