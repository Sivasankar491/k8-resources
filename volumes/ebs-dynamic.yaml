apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-claim-dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic-pod
  labels:
    purpose: ebs-dynamic
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: ebs-dynamic-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-dynamic-volume
    persistentVolumeClaim:
      claimName: ebs-claim-dynamic-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-dynamic
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30072
