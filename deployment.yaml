apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: frontend-Deployment
spec: 
  replicas: 3
  selector: 
    matchLabels:
      app: nginx-pod
  template:
    metadata: 
      name: nginx-pod
      labels:
        app: nginx-pod
    spec:
      containers:
      - name: nginx-container
        image: nginx:stable-perl
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 250Mi
          limits:
            cpu: 200m
            memory: 500Mi

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: LoadBalancer
  selector:
    app: frontend-Deployment
  ports:
  - targetPort: 80
    port: 80
    

