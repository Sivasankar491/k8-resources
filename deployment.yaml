apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: frontend-Deployment
spec: 
  replicas: 3
  selectors: 
    matchLabels:
      app: nginx-pod
  template:
    metadata: 
      name: nginx-pod
      labels:
        app: nginx-pod
    spec:
      containers:
      - name: nginx-container
        image: nginx:stable-perl
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: service
metadata:
  name: nginx-service
spec:
  type: LoadBalancer
  selectors:
    app: frontend-Deployment
  ports:
  - TargetPort: 80
    port: 80

